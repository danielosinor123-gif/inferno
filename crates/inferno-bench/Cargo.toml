[package]
name = "inferno-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Benchmark harness for the inferno scheduler layer (threads, KV, batching)"

[dependencies]
inferno-core = { path = "../inferno-core" }
inferno-model = { path = "../inferno-model" }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[[bin]]
name = "inferno-bench"
path = "src/main.rs"
